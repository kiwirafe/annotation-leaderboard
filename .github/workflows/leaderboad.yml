name: Update Annotation Leaderboard

on:
  schedule:
    - cron: '4/10 * * * *'
      timezone: 'Australia/Sydney'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: annotation-leaderboard
  cancel-in-progress: false

env:
  TARGET_CLIPS: '10'

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    # All shell commands below run relative to the VLM/ folder.
    defaults:
      run:
        working-directory: VLM

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Generate dashboard and progress JSON
        env:
          ANNOTATION_SITE_PASSWORD: ${{ secrets.ANNOTATION_SITE_PASSWORD }}
          ANNOTATION_ADMIN_PASSWORD: ${{ secrets.ANNOTATION_ADMIN_PASSWORD }}
        run: |
          mkdir -p docs/progress_json
          python3 create_leaderboard.py \
            --target-clips "$TARGET_CLIPS" \
            --output docs/index.html \
            --progress-json-dir docs/progress_json

      - name: Persist progress JSON history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/progress_json/

          if git diff --cached --quiet; then
            echo "No new progress JSON snapshot to commit."
          else
            git commit -m "chore: save annotation progress"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
