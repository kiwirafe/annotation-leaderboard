name: Update Annotation Conflict Dashboard

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One audit worker only. Serialize runs so review progress is not lost.
concurrency:
  group: annotation-conflict-audit
  cancel-in-progress: false

env:
  REVIEW_STATE: docs/review_state/annotation_review_progress.json

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Assign review tasks and generate progress dashboard
        env:
          ANNOTATION_SITE_PASSWORD: ${{ secrets.ANNOTATION_SITE_PASSWORD }}
          ANNOTATION_ADMIN_PASSWORD: ${{ secrets.ANNOTATION_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p docs/review_state

          # Migrate an existing ledger without resetting historical adjudications.
          LEGACY_STATE="review_state/annotation_review_progress.json"
          if [[ -f "$LEGACY_STATE" ]]; then
            if [[ ! -f "$REVIEW_STATE" ]]; then
              mv -- "$LEGACY_STATE" "$REVIEW_STATE"
              echo "Migrated existing ledger to $REVIEW_STATE"
            elif cmp -s "$LEGACY_STATE" "$REVIEW_STATE"; then
              rm -- "$LEGACY_STATE"
              echo "Removed identical legacy state file."
            else
              echo "Both legacy and new progress files exist with different data. Resolve manually to avoid losing reviews." >&2
              exit 1
            fi
          fi

          # Never silently reset previously committed review progress.
          if [[ ! -f "$REVIEW_STATE" ]] && \
             { [[ -n "$(git log -1 --format=%H -- "$REVIEW_STATE")" ]] || \
               [[ -n "$(git log -1 --format=%H -- "$LEGACY_STATE")" ]]; }; then
            echo "Review progress was committed before, but is now missing. Refusing to reset." >&2
            exit 1
          fi

          # Keep the raw export in the runner's temporary directory, not the repo.
          umask 077
          python3 annotation_conflict_audit.py \
            --export-path "$RUNNER_TEMP/annotation_export.jsonl" \
            --output docs/index.html \
            --progress-state "$REVIEW_STATE" \

          test -s docs/index.html
          test -s "$REVIEW_STATE"

      - name: Persist adjudication progress
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit only the review ledger and removal of its old location.
          # Never commit raw exports or secrets.
          git add -- "$REVIEW_STATE"
          LEGACY_STATE="review_state/annotation_review_progress.json"
          if git ls-files --error-unmatch "$LEGACY_STATE" >/dev/null 2>&1; then
            git add -u -- "$LEGACY_STATE"
          fi
          if git diff --cached --quiet; then
            echo "No change to adjudication progress."
          else
            git commit -m "chore: save adjudication review assignments"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
