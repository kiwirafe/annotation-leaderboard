name: Update Annotation Leaderboard

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: annotation-leaderboard
  cancel-in-progress: true

env:
  REVIEW_TARGET_UNITS: '700'
  REVIEW_STATE: review_state/annotation_review_progress.json

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Generate conflict audit and update reviewer progress
        env:
          ANNOTATION_SITE_PASSWORD: ${{ secrets.ANNOTATION_SITE_PASSWORD }}
          ANNOTATION_ADMIN_PASSWORD: ${{ secrets.ANNOTATION_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p docs review_state

          # Never silently reset historical progress if its committed file vanished.
          if [[ ! -f "$REVIEW_STATE" ]] && \
             [[ -n "$(git log -1 --format=%H -- "$REVIEW_STATE")" ]]; then
            echo "Review progress was previously committed but is now missing. Refusing to reset it." >&2
            exit 1
          fi

          # Keep the raw export in the runner's temporary directory, not the repo.
          umask 077
          python3 update_leaderboard.py \
            --export-path "$RUNNER_TEMP/annotation_export.jsonl" \
            --output docs/index.html \
            --progress-state "$REVIEW_STATE" \
            --review-target "$REVIEW_TARGET_UNITS"

          test -s docs/index.html
          test -s "$REVIEW_STATE"

      - name: Persist adjudication progress
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit only the review ledger; never commit raw exports or secrets.
          git add -- "$REVIEW_STATE"
          if git diff --cached --quiet; then
            echo "No change to adjudication progress."
          else
            git commit -m "chore: save adjudication review progress"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4